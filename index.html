<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Todo App</h1>
    <p>Manage your tasks easily</p>
    <button type="button" id="theme-toggle">Dark Mode</button>
</header>

    <main>
        <section id="todo-list" aria-labelledby="todo-list-title">
            <h2 id="todo-list-title">My Tasks</h2>
        </section>
        <aside>
            <h2>Todo Detail</h2>

            <article aria-live="polite">
                <h3 id="detail-title">Finish PWEB Assignment</h3>

                <p id="detail-description">
                    Complete the E01a Todo App assignment
                    using HTML and CSS.
                </p>

                <p>
                    <strong>Priority:</strong>
                    <span id="detail-priority">High</span>
                </p>

                <p>
                    <strong>Due Date:</strong>
                    <span id="detail-due-date">13 September 2026</span>
                </p>

                <p>
                    <strong>Status:</strong>
                    <span id="detail-status">In Progress</span>
                </p>

                <button type="button" id="edit-todo-button">Edit Todo</button>
            </article>
        </aside>
    </main>

<section aria-labelledby="form-title">
    <h2 id="form-title">Create New Todo</h2>

        <form id="todo-form">
            <div>
                <label for="todo-title">Todo Title</label>
                <input
                    type="text"
                    id="todo-title"
                    name="todo-title"
                    placeholder="Enter todo title"
                    required
                >
            </div>

            <div>
                <label for="todo-description">Description</label>
                <textarea
                    id="todo-description"
                    name="todo-description"
                    placeholder="Enter todo description"
                    required
                ></textarea>
            </div>

            <div>
                <label for="todo-priority">Priority</label>
                <select id="todo-priority" name="todo-priority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div>
                <label for="todo-date">Due Date</label>
                <input
                    type="date"
                    id="todo-date"
                    name="todo-date"
                    required
                >
            </div>

            <div>
                <label for="todo-notification">Notification Time</label>
                <input
                    type="datetime-local"
                    id="todo-notification"
                    name="todo-notification"
                >
            </div>

            <fieldset>
                <legend>Todo Image</legend>

                <video
                    id="camera-preview"
                    autoplay
                    playsinline
                    muted
                    aria-label="Camera preview"
                    hidden
                ></video>

                <canvas id="photo-canvas" hidden></canvas>

                <div role="group" aria-label="Camera controls">
                    <button type="button" id="open-camera">
                        Open Camera
                    </button>

                    <button type="button" id="take-photo" disabled>
                        Take Photo
                    </button>

                    <button type="button" id="remove-photo" disabled>
                        Remove Photo
                    </button>
                </div>

                <img
                    id="photo-preview"
                    alt="Preview of captured Todo image"
                    hidden
                >
            </fieldset>

            <button type="submit" id="form-submit">Create Todo</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Pemrograman Web A</p>
    </footer>

    <script src="database.js"></script>
    <script src="script.js"></script>
</body>

</html>
